<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrostatic Particle Arena</title>
  <style>
    body {
      margin: 20px;
      font-family: system-ui, sans-serif;
    }
    #canvas {
      display: block;
      border: 1px solid #333;
      background: #111;
      cursor: crosshair;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, select {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <div class="controls">
    <label>
      Material:
      <select id="material">
        <option value="copper">Copper</option>
        <option value="free_copper">Free Copper</option>
        <option value="insulator">Insulator</option>
        <option value="air">Air</option>
        <option value="electron">Electron</option>
      </select>
    </label>
    <button id="playPause">Play</button>
    <button id="reset">Reset</button>
  </div>
  <pre id="errorLog" style="margin-top:10px;font-size:11px;color:#c00;max-height:120px;overflow:auto;display:none"></pre>
  <script src="script.js"></script>
</body>
</html>
