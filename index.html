<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrostatic Particle Arena</title>
  <style>
    body {
      margin: 20px;
      font-family: system-ui, sans-serif;
    }
    #canvas {
      display: block;
      border: 1px solid #333;
      background: #111;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <div class="controls">
    <button id="playPause">Pause</button>
    <button id="reset">Reset</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
